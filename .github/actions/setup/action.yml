name: Setup
description: Install pnpm, Node, and workspace dependencies with a warm cache.

inputs:
  install-args:
    description: Extra arguments for pnpm install, such as --ignore-scripts.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: pnpm install --frozen-lockfile $INSTALL_ARGS
