"area: ui":
  - changed-files:
      - any-glob-to-any-file: "packages/ui/src/**"

"area: registry":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/ui/registry.json"
          - "packages/ui/scripts/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/**"
          - "**/*.mdx"
          - "README.md"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "turbo.json"
          - "vercel.json"

"area: tooling":
  - changed-files:
      - any-glob-to-any-file:
          - ".oxlintrc.json"
          - ".prettierrc"
          - ".prettierignore"
          - ".editorconfig"
          - "packages/typescript-config/**"
          - "tsconfig.json"

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "patches/**"

"release":
  - changed-files:
      - any-glob-to-any-file: ".changeset/**"
