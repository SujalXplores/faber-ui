name: Audit

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Advisory sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      # Most findings here are transitive and unfixable from this repo, so this
      # tracks them in one issue rather than failing pull requests nobody can fix.
      - name: pnpm audit
        id: audit
        run: |
          set +e
          pnpm audit --audit-level=high > audit.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat audit.txt

      - name: Open or update the tracking issue
        if: steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Dependency advisories: high severity or above"
        run: |
          {
            echo "\`pnpm audit --audit-level=high\` is reporting findings as of $(date -u +%Y-%m-%d)."
            echo
            echo "Renovate opens fix PRs for anything it can reach. Findings that persist"
            echo "are transitive and need a \`pnpm.overrides\` entry in \`pnpm-workspace.yaml\`"
            echo "or an upstream release."
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } > body.md

          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label security --label dependencies
          fi

      - name: Close the tracking issue when clean
        if: steps.audit.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Dependency advisories: high severity or above"
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "No high-severity advisories remaining."
          fi
