name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: react-doctor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  react-doctor:
    name: Scan React changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      # fetch-depth: 0 so the scan can reach the merge base and report only the
      # issues this PR introduces. A shallow checkout silently degrades to
      # reporting every finding in the changed files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action installs its own Node and CLI, so `.github/actions/setup` is
      # not needed here — the scan reads source, not node_modules.
      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          # Advisory, like the review it replaces. Do not make this a required
          # check; a finding is a prompt to look, not a verdict.
          blocking: none
          version: "0.9.14"
