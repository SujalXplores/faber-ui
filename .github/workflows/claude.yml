name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    name: Respond to @claude
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only people with write access can drive a bot that has write access.
    if: >-
      (
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
         (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            You are the maintainer bot for Faber UI, a pnpm + Turborepo monorepo:
            `packages/ui` is a shadcn-style component registry built on Base UI
            whose source is copied into consumer projects, and `apps/web` is the
            Fumadocs documentation site.

            Read `README.md` and `AGENTS.md` before writing code. Next.js 16 in
            this repo differs from older conventions — consult
            `node_modules/next/dist/docs/` rather than relying on memory.

            Rules for any change you make:
            - Write no code comments; the codebase does not use them.
            - Pin new dependencies exact, no `^` or `~`.
            - After touching `packages/ui/src`, run `pnpm registry` and commit the
              regenerated `packages/ui/registry.json`.
            - After touching `packages/ui`, add a changeset with `pnpm changeset`
              (patch unless the change is breaking for consumers).
            - Before you finish, `pnpm lint`, `pnpm format:check`, `pnpm typecheck`,
              and `pnpm build` must all pass. If you cannot make them pass, say so
              plainly instead of claiming success.

            Match the surrounding code's naming and idiom. Keep the change scoped
            to what was asked.

          claude_args: |
            --allowedTools "Bash(pnpm:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(node:*),Edit,Write,Read,Glob,Grep"
