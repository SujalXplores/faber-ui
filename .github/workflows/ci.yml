name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm build

      - run: pnpm typecheck

      - name: registry.json is up to date
        run: |
          pnpm --filter @workspace/ui registry:generate
          git diff --exit-code -- packages/ui/registry.json

      # The registry files are what consumers actually fetch. A docs build that
      # succeeds without emitting them ships a site whose install commands 404.
      - name: Built registry is publishable
        run: |
          node -e '
            const fs = require("fs");
            const items = require("./packages/ui/registry.json").items;
            const missing = items.filter((i) => !fs.existsSync("apps/web/public/r/" + i.name + ".json"));
            if (missing.length) {
              console.error("missing built registry files: " + missing.map((i) => i.name).join(", "));
              process.exit(1);
            }
            console.log(items.length + " registry items built");
          '

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm test

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' && github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: A versioned package changed without a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"
