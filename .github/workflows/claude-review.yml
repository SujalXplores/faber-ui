name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks have no access to secrets, and Renovate PRs are covered by CI alone.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'renovate[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out and
            dependencies are installed.

            Faber UI is a pnpm + Turborepo monorepo:
            - `packages/ui` is a shadcn-style component registry built on Base UI.
              Its source is copied into consumer projects, so a defect here ships
              to every consumer. Treat it as public API.
            - `apps/web` is the Fumadocs documentation site.
            - `packages/ui/registry.json` is generated by `pnpm registry`. It must
              stay in sync with `packages/ui/src`.

            Prioritise, in this order:
            1. Correctness bugs, especially ones that cross package boundaries
               or only show up in a consumer project rather than in this repo.
            2. Registry integrity: a component added or renamed without matching
               `registry.json` entries, missing `dependencies` or
               `registryDependencies`, wrong file targets.
            3. React and Next.js 16 correctness: server/client boundaries,
               `"use client"` placement, hook rules, effect dependencies,
               hydration hazards, `forwardRef`/`ref` handling.
            4. Accessibility: keyboard navigation, focus management and focus
               traps, ARIA wiring, `aria-*` on the right node.
            5. Theming: anything that only works in light mode, hardcoded colours
               instead of design tokens, missing dark-mode variants.
            6. Release hygiene: a change under `packages/ui` with no changeset in
               `.changeset/`, or a new dependency that is not pinned exact.

            Repository conventions to enforce:
            - No code comments. Code should be self-explanatory; flag comments
              that restate what the code already says.
            - Dependencies are pinned exact — no `^` or `~` (see `.npmrc`).
            - `next-themes` is patched in `patches/`. Flag any change that would
              invalidate that patch.

            You may run `pnpm lint`, `pnpm typecheck`, `pnpm build`, and
            `pnpm --filter @workspace/ui registry:generate` to verify a concern
            before reporting it. Prefer a verified finding over a speculative one.

            Do not comment on style that Prettier or oxlint already enforce.
            If you find nothing substantive, say so in one short comment rather
            than inventing findings.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues anchored to a specific line, and
            `gh pr comment` for the summary. Only post GitHub comments — do not
            return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(pnpm lint),Bash(pnpm format:check),Bash(pnpm typecheck),Bash(pnpm build),Bash(pnpm --filter @workspace/ui registry:generate)"
